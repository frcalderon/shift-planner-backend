name: Close issues on merge to develop

# GitHub only honours "Closes #N" for PRs into the default branch (main).
# This closes them for PRs merged into develop; the project's "Item closed" automation moves them to Done.
on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          issues=$(
            {
              printf '%s\n' "$PR_BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' || true
              printf '%s\n' "$PR_BRANCH" | grep -oE 'GH-[0-9]+' | grep -oE '[0-9]+' || true
            } | sort -un
          )
          if [ -z "$issues" ]; then
            echo "No referenced issues"
            exit 0
          fi
          for issue in $issues; do
            if [ "$(gh issue view "$issue" --json state --jq .state)" = "OPEN" ]; then
              gh issue close "$issue" --reason completed --comment "Closed by #$PR_NUMBER (merged into develop)."
            else
              echo "Issue #$issue already closed"
            fi
          done
