spring:
  application:
    name: shift-planner
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.frcalderon.shiftplanner: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    root: WARN
    com.frcalderon.shiftplanner: INFO
