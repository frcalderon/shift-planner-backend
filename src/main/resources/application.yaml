spring:
  application:
    name: shift-planner
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shiftplanner}
    username: ${DB_USERNAME:shiftplanner}
    password: ${DB_PASSWORD:shiftplanner}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      lifecycle-management: start-only

logging:
  level:
    com.frcalderon.shiftplanner: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    root: WARN
    com.frcalderon.shiftplanner: INFO
